<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecycleBin.com - Events</title>
<link rel="stylesheet" href="./css/_site.css">
<style>
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.95);
    min-height: calc(100vh - 60px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    animation: fadeIn 0.6s;
    display: flex;
    flex-direction: column;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  header {
    background: linear-gradient(135deg, #2e7d32 0%, #66bb6a 100%);
    color: white;
    padding: 30px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  h1 { font-size: 2em; margin-bottom: 10px; position: relative; z-index: 1; }
  .subtitle { opacity: 0.95; font-size: 1.1em; position: relative; z-index: 1; }

  .events-section {
    padding: 30px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .event-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  @media (max-width: 860px) {
    .event-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 540px) {
    .event-grid { grid-template-columns: 1fr; }
  }
  .event-card {
    background: #ffffff;
    border: 1px solid #e6f0ea;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 4px 14px rgba(46, 125, 50, 0.06);
  }
  .event-card h3 {
    font-size: 15px;
    color: #1b5e20;
    margin-bottom: 4px;
  }
  .event-card .meta {
    color: #555;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .event-card .meta span { margin-right: 10px; }
  .event-card p {
    color: #666;
    font-size: 13px;
    line-height: 1.5;
  }
  .event-card .actions {
    margin-top: 10px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .pill {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
    background: #e8f5e9;
    color: #1b5e20;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid #c8e6c9;
  }
  .no-results {
    color: #555;
    font-size: 14px;
    padding: 10px 0;
  }
  .filter-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-bar input {
    flex: 1 1 220px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #e6f0ea;
    background: #fff;
    color: #1b5e20;
    outline: none;
  }
  .filter-bar input:focus { border-color: #2e7d32; }
  .filter-bar button {
    padding: 8px 11px;
    border-radius: 999px;
    border: 1px solid #e6f0ea;
    background: #fff;
    color: #2e7d32;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
  }
  .filter-bar button:hover { background: #e8f5e9; }
  .filter-bar button.active {
    background: #2e7d32;
    border-color: #2e7d32;
    color: white;
  }
</style>
</head>
<body>
<div class="menu-bar">
  <a href="./index.html"><span class="logo">♻️</span><span>RecycleBin</span></a>
  <nav class="menu-nav">
    <a class="menu-link" href="./games.html" data-menu="games">🎮 Games</a>
    <a class="menu-link" href="./guides.html" data-menu="guides">📚 Guides</a>
    <a class="menu-link" href="./centers.html" data-menu="centers">📍 Centers</a>
    <a class="menu-link" href="./events.html" data-menu="events">📅 Events</a>
    <a class="menu-link" href="./howto.html" data-menu="howto">🛠️ How-To</a>
  </nav>
</div>

<div class="container">
  <header>
    <h1>📅 Events</h1>
    <div class="subtitle">Community recycling events and workshops.</div>
  </header>

  <section class="events-section">
    <div class="filter-bar">
      <input id="searchInput" type="text" placeholder="Search by title or location">
      <button id="allBtn" class="active">All</button>
      <button id="caBtn">CA</button>
      <button id="upcomingBtn">Upcoming</button>
    </div>
    <div id="results" class="event-grid"></div>
  </section>

  <div id="site-footer"></div>
</div>

<script src="./js/menu.js"></script>
<script src="./js/footer.js"></script>
<script>
(function() {
  var allEvents = [];
  var filter = 'all';
  var keyword = '';

  function parseDate(s) {
    var parts = s.split('-');
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }
  function formatDateLabel(s) {
    var d = parseDate(s);
    return d.toLocaleDateString('en-US', {year: 'numeric', month: 'short', day: 'numeric'});
  }
  function todayStart() {
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function filtered() {
    return allEvents.filter(function(e) {
      var matchKeyword = !keyword || (e.title + ' ' + e.location).toLowerCase().indexOf(keyword) !== -1;
      if (!matchKeyword) return false;
      if (filter === 'ca') return e.state === 'CA';
      if (filter === 'upcoming') return parseDate(e.date) >= todayStart();
      return true;
    }).sort(function(a, b) {
      return parseDate(a.date) - parseDate(b.date);
    });
  }

  function render() {
    var box = document.getElementById('results');
    var list = filtered();
    if (!list.length) {
      box.innerHTML = '<p class="no-results">No matching events.</p>';
      return;
    }
    box.innerHTML = list.map(function(e) {
      return '<div class="event-card">' +
        '<h3>' + e.title + '</h3>' +
        '<div class="meta">' +
          '<span>📅 ' + formatDateLabel(e.date) + '</span>' +
          '<span>📍 ' + e.location + '</span>' +
        '</div>' +
        '<p>' + e.desc + '</p>' +
        (e.join_url ? '<div class="actions"><a href="' + e.join_url + '" target="_blank" rel="noopener">View Event</a><span class="pill">' + e.state + '</span></div>' : '') +
      '</div>';
    }).join('');
  }

  fetch("./events/events.json", {cache: "no-store"}).then(function(r) {
    return r.ok ? r.json() : [];
  }).then(function(data) {
    allEvents = data || [];
    render();
  }).catch(function() {
    document.getElementById("results").innerHTML = '<p class="no-results">Events are currently unavailable.</p>';
  });

  document.getElementById('searchInput').addEventListener('input', function(e) {
    keyword = e.target.value.trim().toLowerCase();
    render();
  });
  document.getElementById('allBtn').addEventListener('click', function() {
    filter = 'all';
    setActive(this);
    render();
  });
  document.getElementById('caBtn').addEventListener('click', function() {
    filter = 'ca';
    setActive(this);
    render();
  });
  document.getElementById('upcomingBtn').addEventListener('click', function() {
    filter = 'upcoming';
    setActive(this);
    render();
  });
  function setActive(btn) {
    ['allBtn', 'caBtn', 'upcomingBtn'].forEach(function(id) {
      document.getElementById(id).classList.toggle('active', id === btn.id);
    });
  }
})();
</script>
</body>
</html>
