<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecycleBin.com - Events</title>
<link rel="stylesheet" href="./css/_site.css">
</head>
<body>
  <div id="site-header"></div>

<!-- Compact Menu Bar -->
<div class="menu-bar">
  <a class="menu-logo" href=".//index.html">
    <span class="logo-icon">♻️</span>
    <span>RecycleBin</span>
  </a>
  <nav class="menu-nav">
    <a class="menu-link" href=".//games.html">🎮 Games</a>
    <a class="menu-link" href=".//guides.html">📚 Guides</a>
    <a class="menu-link" href=".//centers.html">📍 Centers</a>
    <a class="menu-link" href=".//events.html">📅 Events</a>
    <a class="menu-link" href=".//howto.html">🛠️ How-To</a>
  </nav>
</div>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Events</h1>
      </div>
    </section>
    <section>
      <div class="container">
        <p>Community events coming soon.</p>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script>
    (function() {
      var page = location.pathname.split('/').pop() || 'index.html';
      var links = document.querySelectorAll('.menu-link');
      links.forEach(function(a) {
        var href = a.getAttribute('href') || '';
        a.classList.toggle('active', href && href.indexOf(page) > -1);
      });
    })();
  </script>
  <script src="./js/_site.js"></script>
</body>
</html>
