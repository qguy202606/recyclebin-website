<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RecycleBin.com - Events</title>
<link rel="stylesheet" href="/css/main.css" />
</head>
<body>
<header>
  <div class="container header-inner">
    <a href="/index.html" class="logo"><span>Recycle</span>Bin.com</a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="/guides.html" data-i18n="nav_guides">Guides</a></li>
        <li><a href="/centers.html" data-i18n="nav_centers">Centers</a></li>
        <li><a href="/events.html" class="active" data-i18n="nav_events">Events</a></li>
        <li><a href="/howto.html" data-i18n="nav_howto">How-To</a></li>
      </ul>
      <button id="langToggle" class="lang-toggle" type="button">EN</button>
    </div>
  </div>
</header>

<main>
  <section class="page-header">
    <div class="container">
      <h1 data-i18n="nav_events">Events</h1>
      <p data-i18n="events_sub">Community recycling, cleanup, and education.</p>
      <div class="filter-bar">
        <label for="stateSelect" data-i18n="filter_state">Filter by state:</label>
        <select id="stateSelect">
          <option value="ALL" data-i18n="filter_all">All United States</option>
        </select>
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <div id="feed-status" class="feed-notice" data-i18n="loading">Loading events…</div>
      <div id="event-list" class="event-list"></div>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    <p>&copy; 2025 RecycleBin.com</p>
  </div>
</footer>

<script src="/js/site.js"></script>
<script>
(function () {
  'use strict';
  var listEl = document.getElementById('event-list');
  var statusEl = document.getElementById('feed-status');
  var stateSelect = document.getElementById('stateSelect');
  var current = 'ALL';

  function renderStates(states) {
    if (!stateSelect) return;
    stateSelect.innerHTML = '<option value="ALL">' + (RecycleBin.t('filter_all') || 'All United States') + '</option>';
    (states || []).forEach(function (s) {
      var opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      stateSelect.appendChild(opt);
    });
  }

  function card(ev) {
    return (
      '<div class="event-card">' +
        '<div class="date">' + ev.date + '</div>' +
        (ev.state ? '<div class="badge">' + ev.state + '</div>' : '') +
        '<h3>' + ev.title + '</h3>' +
        (ev.desc ? '<p>' + ev.desc + '</p>' : '') +
        (ev.location ? '<p class="meta">' + ev.location + '</p>' : '') +
        '<div class="actions">' +
          '<a class="btn btn-primary" href="/event-detail.html?id=' + ev.id + '">' + (RecycleBin.t('read_more') || 'Read More') + '</a>' +
          (ev.join_url ? '<a class="btn btn-secondary" target="_blank" rel="noopener" href="' + ev.join_url + '">' + (RecycleBin.t('event_join') || 'Join Now') + '</a>' : '') +
        '</div>' +
      '</div>'
    );
  }

  function render(data) {
    var items;
    if (current === 'ALL') {
      items = data.slice();
    } else {
      items = data.filter(function (x) { return x.state === current; });
    }
    if (!items.length) {
      if (statusEl) statusEl.textContent = (RecycleBin.t('status_none') || 'No events available.');
      if (listEl) listEl.innerHTML = '';
      return;
    }
    if (statusEl) statusEl.textContent = (RecycleBin.t('status_loaded') || '');
    if (listEl) listEl.innerHTML = items.map(card).join('');
  }

  async function toJSON(url) {
    try {
      var res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('bad status: ' + res.status);
      return await res.json();
    } catch (err) {
      window.__eventsLoadError = err;
      return [];
    }
  }

  async function load() {
    var data = await toJSON('/events.json');
    if (!Array.isArray(data)) data = [];
    window.__eventsData = data;
    if (data.length) {
      var states = data.map(function (e) { return e.state; });
      renderStates(Array.from(new Set(states.filter(Boolean))).sort());
      render(data);
    } else {
      renderStates(['CA','CO','FL','IL','NJ']);
      render([]);
    }
  }

  if (stateSelect) {
    stateSelect.addEventListener('change', function () {
      current = stateSelect.value;
      render(window.__eventsData || []);
    });
  }

  RecycleBin.initLayout({ active: '/events.html' });
  RecycleBin.initI18n();
  load();
})();
</script>
</body>
</html>
