<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecycleBin - Events</title>
<link rel="stylesheet" href="./css/_site.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #e0f7fa 0%, #fff3e0 100%);
    min-height: 100vh;
    padding: 0;
    color: #333;
    overflow-x: hidden;
  }

  /* Compact Menu Bar */
  .menu-bar {
    background: white;
    border-bottom: 2px solid #e0e0e0;
    padding: 10px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .menu-logo {
    font-size: 1.2em;
    font-weight: 800;
    color: #2e7d32;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .menu-logo:hover { opacity: 0.8; }
  .menu-logo .logo {
    background: #2e7d32;
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1em;
  }
  .menu-nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .menu-link {
    padding: 6px 10px;
    background: #f5f5f5;
    border-radius: 18px;
    text-decoration: none;
    color: #555;
    font-size: 0.8em;
    font-weight: 600;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .menu-link:hover {
    background: #e8f5e9;
    color: #2e7d32;
    transform: translateY(-1px);
  }
  .menu-link.active {
    background: #2e7d32;
    color: white;
  }

  .container {
    max-width: 980px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.95);
    min-height: calc(100vh - 60px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    animation: fadeIn 0.6s;
    display: flex;
    flex-direction: column;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  header {
    background: linear-gradient(135deg, #2e7d32 0%, #66bb6a 100%);
    color: #e6fff0;
    padding: 64px 20px 56px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header h1 { font-size: 38px; font-weight: 800; letter-spacing: 0.2px; margin-bottom: 12px; position: relative; z-index: 1; }
  .subtitle { opacity: 0.95; font-size: 17px; line-height: 1.6; color: #c8e6c9; position: relative; z-index: 1; }

  .event-controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    align-items: center;
  }
  .event-controls input[type="search"] {
    flex: 1 1 220px;
    padding: 10px 12px;
    border: 1px solid #cfe3d3;
    border-radius: 8px;
  }
  .event-controls button {
    padding: 10px 12px;
    border: 1px solid #cfe3d3;
    background: #f1f8f4;
    color: #1b5e20;
    border-radius: 8px;
    cursor: pointer;
  }
  .event-controls button.active { background: #e7f5ea; border-color: #8cc299; }
  .event-controls select {
    padding: 10px 12px;
    border: 1px solid #cfe3d3;
    background: #f1f8f4;
    color: #1b5e20;
    border-radius: 8px;
    cursor: pointer;
  }

  .event-card {
    background: #fff;
    border: 1px solid #e6f2ea;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04);
  }
  .event-card h3 { color: #1b5e20; margin-bottom: 6px; }
  .event-meta { color: #5a6f5e; font-size: 0.97em; }
  .event-link { color: #2e7d57; text-decoration: none; font-weight: 600; }
  .event-link:hover { text-decoration: underline; }
  .event-count { color: #5a6f5e; margin: 0 0 12px; }
  .empty { color: #6a7a6e; text-align: center; padding: 18px 0; }

  @media (max-width: 640px) {
    header { padding: 36px 16px 40px; }
    .event-controls { padding: 0 16px; }
    .container { padding: 0 4px; }
  }
</style>
</head>
<body>

<div class="menu-bar">
  <a href="./index.html" class="menu-logo"><span class="logo">♻️</span><span>RecycleBin</span></a>
  <nav class="menu-nav">
    <a class="menu-link" href="./games.html" data-menu="games">🎮 Games</a>
    <a class="menu-link" href="./guides.html" data-menu="guides">📚 Guides</a>
    <a class="menu-link" href="./centers.html" data-menu="centers">📍 Centers</a>
    <a class="menu-link active" href="./events.html" data-menu="events">📅 Events</a>
    <a class="menu-link" href="./howto.html" data-menu="howto">🛠️ How-To</a>
  </nav>
</div>

<div class="container">
  <header>
    <h1>📅 Events</h1>
    <div class="subtitle">Cleanups, talks, and workshops near you.</div>
  </header>

  <section class="event-section" style="padding:24px; flex:1;">
    <div class="event-controls">
      <input id="event-search" type="search" placeholder="Search events..." />
      <select id="event-state">
        <option value="">All states</option>
      </select>
      <button id="event-all" class="active">Show All</button>
      <button id="event-upcoming">Upcoming</button>
    </div>
    <p id="event-count" class="event-count"></p>
    <div id="event-grid"></div>
  </section>

  <footer class="site-footer">
    <div class="footer-links">
      <a class="footer-link" href="./games.html">Games</a>
      <a class="footer-link" href="./guides.html">Guides</a>
      <a class="footer-link" href="./centers.html">Centers</a>
      <a class="footer-link" href="./events.html">Events</a>
      <a class="footer-link" href="./howto.html">How-To</a>
    </div>
    <div>Made with 💚 for Earth 🌍</div>
    <div>© 2026 RecycleBin.com. All rights reserved.</div>
  </footer>
</div>

<script src="./js/menu.js"></script>
<script>
const EVENTS_PATH = './events/events.json';
const grid = document.getElementById('event-grid');
const countEl = document.getElementById('event-count');
const searchInput = document.getElementById('event-search');
const stateSelect = document.getElementById('event-state');
const btnAll = document.getElementById('event-all');
const btnUpcoming = document.getElementById('event-upcoming');
let events = [];
let mode = 'all';

function stateCode(ev) {
  const direct = String(ev.state || '').trim().toUpperCase();
  if (direct) return direct;
  const m = String(ev.location || '').match(/([A-Z]{2})$/);
  return m ? m[1] : '';
}
function collectStates() {
  const s = new Set();
  events.forEach(ev => { const c = stateCode(ev); if (c) s.add(c); });
  return Array.from(s).sort();
}
function populateStates() {
  const states = collectStates();
  stateSelect.innerHTML = '<option value="">All states</option>' + states.map(st => `<option value="${st}">${st}</option>`).join('');
}

function isLocal(text) {
  const t = String(text || '').toLowerCase();
  return /irvine|orange county|huntington beach|long beach|los angeles|south gate|anaheim|fullerton|santa ana|o\.c\.|oc /.test(t);
}
function localPriority(ev) {
  const loc = isLocal(ev.location) || isLocal(ev.address || '') || isLocal(ev.body || '');
  const stateCA = String(ev.state || '').toUpperCase() === 'CA';
  return (loc ? 0 : 1) + (stateCA ? 0 : 1);
}

function formatDateRange(start, end) {
  const s = new Date(start);
  const e = new Date(end);
  const opts = { month: 'short', day: 'numeric' };
  if (isNaN(s) || isNaN(e)) return 'Date TBD';
  if (s.toDateString() === e.toDateString()) return s.toLocaleDateString('en-US', opts);
  return `${s.toLocaleDateString('en-US', opts)} – ${e.toLocaleDateString('en-US', opts)}`;
}
function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const state = String(stateSelect.value || '').trim().toUpperCase();
  const now = new Date();
  let list = events.filter(ev => {
    const start = ev.start ? new Date(ev.start) : (ev.date ? new Date(ev.date) : null);
    const inFuture = !start || isNaN(start) || start >= now;
    const textMatch = [ev.title, ev.desc, ev.location, ev.body].some(v => String(v || '').toLowerCase().includes(q));
    const stateMatch = !state || stateCode(ev) === state;
    if (mode === 'upcoming') return textMatch && stateMatch && inFuture;
    return textMatch && stateMatch;
  });
  list.sort((a, b) => (localPriority(a) - localPriority(b)) || new Date(a.start || a.date || '9999') - new Date(b.start || b.date || '9999'));
  countEl.textContent = `${list.length} event${list.length === 1 ? '' : 's'}`;
  grid.innerHTML = list.length
    ? list.map(ev => {
        const start = ev.start || ev.date;
        const end = ev.end || start;
        const loc = ev.location || '';
        const url = ev.join_url || ev.url || '';
        return `<article class="event-card">
          <h3>${escapeHtml(ev.title)}</h3>
          <p class="event-meta">📅 ${formatDateRange(start, end)} · ${escapeHtml(loc || 'TBD')}</p>
          <p>${escapeHtml(ev.desc || '')}</p>
          ${url ? `<a class="event-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">View details</a>` : ''}
        </article>`;
      }).join('')
    : `<p class="empty">No events match.</p>`;
}

btnAll.addEventListener('click', () => { mode = 'all'; btnAll.classList.add('active'); btnUpcoming.classList.remove('active'); render(); });
btnUpcoming.addEventListener('click', () => { mode = 'upcoming'; btnUpcoming.classList.add('active'); btnAll.classList.remove('active'); render(); });
searchInput.addEventListener('input', render);
stateSelect.addEventListener('change', render);

fetch(EVENTS_PATH)
  .then(r => r.text())
  .then(t => {
    try {
      const raw = JSON.parse(t);
      events = Array.isArray(raw) ? raw : (raw.events || []);
    } catch (err) { events = []; console.error('events.json parse failed', err); }
    populateStates();
    render();
  })
  .catch(err => { console.error(err); grid.innerHTML = '<p class="empty">Could not load events.</p>'; });
</script>
</body>
</html>
