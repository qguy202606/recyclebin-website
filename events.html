<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecycleBin.com - Events</title>
<link rel="stylesheet" href="./css/_site.css">
<style>
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.95);
    min-height: calc(100vh - 60px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    animation: fadeIn 0.6s;
    display: flex;
    flex-direction: column;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  header {
    background: linear-gradient(135deg, #2e7d32 0%, #66bb6a 100%);
    color: white;
    padding: 30px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  h1 { font-size: 2em; margin-bottom: 10px; position: relative; z-index: 1; }
  .subtitle { opacity: 0.95; font-size: 1.1em; position: relative; z-index: 1; }

  .events-section {
    padding: 30px;
    flex: 1;
  }
  .event-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  @media (max-width: 860px) {
    .event-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 540px) {
    .event-grid { grid-template-columns: 1fr; }
  }
  .event-card {
    background: #ffffff;
    border: 1px solid #e6f0ea;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 4px 14px rgba(46, 125, 50, 0.06);
  }
  .event-card h3 {
    font-size: 15px;
    color: #1b5e20;
    margin-bottom: 4px;
  }
  .event-card .meta {
    color: #555;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .event-card .meta span { margin-right: 10px; }
  .event-card p {
    color: #666;
    font-size: 13px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<!-- Compact Menu Bar (uses shared CSS in css/_site.css and auto highlight in js/menu.js) -->
<div class="menu-bar">
  <a href="./index.html"><span class="logo">♻️</span><span>RecycleBin</span></a>
  <nav class="menu-nav">
    <a class="menu-link" href="./games.html" data-menu="games">🎮 Games</a>
    <a class="menu-link" href="./guides.html" data-menu="guides">📚 Guides</a>
    <a class="menu-link" href="./centers.html" data-menu="centers">📍 Centers</a>
    <a class="menu-link" href="./events.html" data-menu="events">📅 Events</a>
    <a class="menu-link" href="./howto.html" data-menu="howto">🛠️ How-To</a>
  </nav>
</div>

<div class="container">
  <header>
    <h1>📅 Events</h1>
    <div class="subtitle">Community recycling events and workshops.</div>
  </header>

  <section class="events-section">
    <div id="results" class="event-grid"></div>
  </section>

  <div id="site-footer"></div>
</div>

<script src="./js/menu.js"></script>
<script src="./js/footer.js"></script>
<script>
(function() {
  var events = [];
  fetch("./events/events.json", {cache: "no-store"}).then(function(r) {
    return r.ok ? r.json() : [];
  }).then(function(data) {
    events = data || [];
    render(events);
  }).catch(function() {
    document.getElementById("results").innerHTML = '<p style="color:#555;font-size:14px;">Events are currently unavailable.</p>';
  });

  function render(list) {
    var box = document.getElementById("results");
    if (!list.length) {
      box.innerHTML = '<p style="color:#555;font-size:14px;">No upcoming events.</p>';
      return;
    }
    box.innerHTML = list.map(function(e) {
      return '<div class="event-card">' +
        '<h3>' + e.title + '</h3>' +
        '<div class="meta">' +
          '<span>📅 ' + e.date + '</span>' +
          '<span>⏰ ' + e.time + '</span>' +
        '</div>' +
        '<div class="meta">📍 ' + e.location + '</div>' +
        '<p>' + e.description + '</p>' +
      '</div>';
    }).join("");
  }
})();
</script>

</body>
</html>
