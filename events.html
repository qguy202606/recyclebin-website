<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecycleBin.com - Events</title>
  <link rel="stylesheet" href="./css/_site.css" />
  <link rel="stylesheet" href="./css/main.css" />
  <style>
    .container {
      max-width: 980px;
      margin: 0 auto;
      background: rgba(255,255,255,0.96);
      min-height: calc(100vh - 56px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
      border-radius: 14px;
      animation: fadeIn 0.4s;
      display: flex;
      flex-direction: column;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .page-header { text-align: center; padding: 44px 24px 24px; }
    .page-header h1 { color: #1b5e20; font-size: 2em; margin-bottom: 6px; }
    .page-header p { color: #5a6f5e; }
    .event-section { padding: 24px; flex: 1; }
    @media (max-width: 640px) {
      .event-section { padding: 16px; }
    }
  </style>
</head>
<body>
<div id="site-header"></div>
<main class="container">
  <header class="page-header">
    <h1>📅 Events</h1>
    <p>Local cleanups, talks, and workshops — Irvine first.</p>
  </header>
  <section class="event-section">
    <p style="text-align:center; color:#5a6f5e;">Full event calendar is being finalized. Check back soon.</p>
  </section>
  <div id="site-footer"></div>
</main>
<script src="./js/menu.js"></script>
<script src="./js/footer.js"></script>
</body>
</html>
