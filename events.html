<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecycleBin.com - Events</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #fff; background: #0b0b0b; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  header { background: #0b0b0b; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
  .logo { font-size: 24px; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .logo span { background: #0f9d58; color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 20px; }
  .nav-right { display: flex; align-items: center; gap: 20px; }
  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links a { text-decoration: none; color: #c9c9c9; font-weight: 500; transition: color 0.2s; }
  .nav-links a:hover { color: #0f9d58; }
  .nav-links a.active { color: #0f9d58; }
  .lang-toggle { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
  .lang-toggle:hover { border-color: #0f9d58; color: #0f9d58; }
  .page-header { padding: 80px 0 40px; text-align: center; }
  .page-header h1 { font-size: 48px; font-weight: 800; margin-bottom: 16px; }
  .page-header p { color: #8f8f8f; font-size: 18px; max-width: 700px; margin: 0 auto; }
  .event-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; padding-bottom: 100px; }
  .event-card { background: #111; border: 1px solid #1f1f1f; border-radius: 20px; padding: 28px; transition: transform 0.2s, box-shadow 0.2s; }
  .event-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-color: #1e352a; }
  .event-card .date { display: inline-block; padding: 6px 12px; background: #11211a; color: #0f9d58; border: 1px solid #1e352a; border-radius: 10px; font-size: 13px; font-weight: 700; margin-bottom: 14px; }
  .event-card h3 { font-size: 20px; margin-bottom: 6px; color: #e9e9e9; }
  .event-card p { color: #8a8a8a; font-size: 14px; margin-bottom: 18px; }
  .event-card .btn { display: inline-block; padding: 10px 22px; background: #0f9d58; color: #fff; border-radius: 8px; text-decoration: none; font-size: 14px; }
  .event-card .btn-secondary { background: #141414; color: #e8e8e8; border: 1px solid #2e2e2e; }
  .feed-notice { background: #111; border: 1px solid #2e2e2e; color: #bfbfbf; padding: 10px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; }
  footer { background: #050505; padding: 40px 0; border-top: 1px solid #141414; text-align: center; color: #555; font-size: 13px; }
  @media (max-width: 768px) { .nav-links { display: none; } .page-header h1 { font-size: 32px; } }
</style>
</head>
<body>
<header>
  <div class="container">
    <nav>
      <a href="index.html" class="logo"><span>Recycle</span> Bin.com</a>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="index.html" data-i18n="nav_home">Home</a></li>
          <li><a href="guides.html" data-i18n="nav_guides">Guides</a></li>
          <li><a href="centers.html" data-i18n="nav_centers">Centers</a></li>
          <li><a href="events.html" class="active" data-i18n="nav_events">Events</a></li>
          <li><a href="howto.html" data-i18n="nav_howto">How-To Tutorials</a></li>
        </ul></div>
    </nav>
  </div>
</header>
<main>
  <section class="page-header">
    <div class="container">
      <h1 data-i18n="events_page_title">Upcoming Events</h1>
      <p data-i18n="events_page_sub">Community events are powered by an external source. Check back soon for listings from partner organizations.</p>
      <div style="margin-top:24px; display:flex; gap:12px; align-items:center;">
        <label for="state-filter" style="color:#9a9a9a; font-size:14px;">Filter by state:</label>
        <select id="state-filter" style="background:#141414; color:#e8e8e8; border:1px solid #2e2e2e; border-radius:8px; padding:8px 12px; font-size:14px; min-width:160px;">
          <option value="ALL">All United States</option>
        </select>
      </div>
    </div>
  </section>
  <section>
    <div class="container">
      <div id="feed-status" class="feed-notice hidden">Loading events...</div>
      <div class="event-list" id="event-list"></div>
    </div>
  </section>
</main>
<footer>
  <div class="container">
    <p>&copy; 2025 RecycleBin.com. All rights reserved.</p>
  </div>
</footer>
<script>
  const i18n = {
    'en': {
      nav_home:'Home', nav_guides:'Guides', nav_centers:'Centers', nav_events:'Events', nav_howto:'How-To',
      events_page_title:'Upcoming Events', events_page_sub:'Community events are powered by an external source. Check back soon for listings from partner organizations.',
      loading:'Loading events...', no_events:'No events available.', external_feed:'Events are loaded from an external provider.'
    }
  };
  function setLanguage(l){ document.documentElement.lang=l; localStorage.setItem('recyclebin-lang',l); const m=i18n[l]||i18n['en']; document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.getAttribute('data-i18n'); const v=m[k]; if(!v)return; el.innerHTML=v; }); }
  (function(){ const s=localStorage.getItem('recyclebin-lang'); if(s&&(s==='en'||s==='en')) setLanguage(s); })();

  async function loadEvents(){
    const list = document.getElementById('event-list');
    const status = document.getElementById('feed-status');
    const stateFilter = document.getElementById('state-filter');
    if (!list || !status) return;
    status.classList.remove('hidden');
    status.textContent = i18n['en'].loading;
    try {
      const res = await fetch('events.json', {cache: 'no-store'});
      if (!res.ok) throw new Error('fetch failed');
      const data = await res.json();
      console.log('[events] raw data:', data);
      if (!Array.isArray(data)) throw new Error('bad data');
      const selected = stateFilter ? stateFilter.value : 'ALL';
      const filtered = selected === 'ALL' ? data : data.filter(ev => (ev.state || '') === selected);
      const states = Array.from(new Set((data || []).map(ev => ev.state).filter(Boolean))).sort();
      console.log('[events] states:', states, 'selected:', selected);
      if (stateFilter) {
        stateFilter.innerHTML = ['<option value="ALL">All United States</option>', ...states.map(s => `<option value="${s}">${s}</option>`).join('')];
        stateFilter.value = selected;
        console.log('[events] filter options:', stateFilter.innerHTML);
      }
      if (!filtered.length) {
        status.textContent = i18n['en'].no_events;
        list.innerHTML = '';
        return;
      }
      status.textContent = i18n['en'].external_feed;
      list.innerHTML = filtered.map(ev => `
        <div class="event-card">
          <div class="date">${ev.date}</div>
          <h3>${ev.title}</h3>
          <p>${ev.desc}</p>
          <a class="btn" href="event-detail.html?id=${ev.id || '#'}">Details</a>
        </div>
      `).join('');
    } catch (e) {
      status.textContent = i18n['en'].no_events;
    }
  }

  function setupStateFilter(){
    const stateFilter = document.getElementById('state-filter');
    if (!stateFilter) return;
    stateFilter.addEventListener('change', loadEvents);
  }

  loadEvents();
  setupStateFilter();
</script>
</body>
</html>
