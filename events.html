<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg">
  <title>RecycleBin.com - Events</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #fff; background: #0b0b0b; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  header { background: #0b0b0b; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
  .logo { font-size: 24px; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .logo span { background: #0f9d58; color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 20px; }
  .nav-right { display: flex; align-items: center; gap: 20px; }
  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links a { text-decoration: none; color: #c9c9c9; font-weight: 500; transition: color 0.2s; }
  .nav-links a:hover, .nav-links a.active { color: #0f9d58; }
  .page-header { padding: 80px 0 40px; text-align: center; }
  .page-header h1 { font-size: 48px; font-weight: 800; margin-bottom: 16px; }
  .page-header p { color: #8f8f8f; font-size: 18px; max-width: 700px; margin: 0 auto; }
  .event-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; padding-bottom: 100px; }
  .event-card { background: #111; border: 1px solid #1f1f1f; border-radius: 20px; padding: 28px; transition: transform 0.2s, box-shadow 0.2s; }
  .event-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-color: #1e352a; }
  .event-card .date { display: inline-block; padding: 6px 12px; background: #11211a; color: #0f9d58; border: 1px solid #1e352a; border-radius: 10px; font-size: 13px; font-weight: 700; margin-bottom: 14px; }
  .event-card h3 { font-size: 20px; margin-bottom: 6px; color: #e9e9e9; }
  .event-card p { color: #8a8a8a; font-size: 14px; margin-bottom: 18px; }
  .event-card .btn { display: inline-block; padding: 10px 22px; background: #0f9d58; color: #fff; border-radius: 8px; text-decoration: none; font-size: 14px; }
  .event-card .btn-secondary { background: #141414; color: #e8e8e8; border: 1px solid #2e2e2e; }
  .feed-notice { background: #111; border: 1px solid #2e2e2e; color: #bfbfbf; padding: 10px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; }
  .hidden { display: none !important; }
  footer { background: #050505; padding: 40px 0; border-top: 1px solid #141414; text-align: center; color: #555; font-size: 13px; }
  @media (max-width: 768px) { .nav-links { display: none; } .page-header h1 { font-size: 32px; } }
  .filter-bar { margin: 0 auto 10px; max-width: 420px; text-align: center; }
  .filter-bar label { color: #9a9a9a; font-size: 14px; margin-right: 8px; }
  #stateSelect { background: #141414; color: #e8e8e8; border: 1px solid #2e2e2e; border-radius: 8px; padding: 8px 12px; font-size: 14px; min-width: 180px; }
  .badge { display: inline-block; padding: 4px 10px; background: #11211a; color: #0f9d58; border: 1px solid #1e352a; border-radius: 999px; font-size: 12px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="container">
    <nav>
      <a href="index.html" class="logo"><span>Recycle</span> Bin.com</a>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="guides.html">Guides</a></li>
          <li><a href="centers.html">Centers</a></li>
          <li><a href="events.html" class="active">Events</a></li>
          <li><a href="howto.html">How-To</a></li>
        </ul>
      </div>
    </nav>
  </div>
</header>
<main>
  <section class="page-header">
    <div class="container">
      <h1>Upcoming Events</h1>
      <p>Community events are powered by an external source. Check back soon for listings from partner organizations.</p>
      <div class="filter-bar">
        <label for="stateSelect">Filter by state:</label>
        <select id="stateSelect"><option value="ALL">All United States</option></select>
      </div>
    </div>
  </section>
  <section>
    <div class="container">
      <div id="feed-status" class="feed-notice">Loading events...</div>
      <div class="event-list" id="event-list"></div>
    </div>
  </section>
</main>
<footer>
  <div class="container">&copy; 2025 RecycleBin.com. All rights reserved.</div>
</footer>
<script>
  (function(){
    const list = document.getElementById('event-list');
    const status = document.getElementById('feed-status');
    const stateSelect = document.getElementById('stateSelect');
    let currentState = 'ALL';

    function renderOptions(states){
      if (!stateSelect) return;
      try {
        stateSelect.innerHTML = '';
        const allOpt = document.createElement('option');
        allOpt.value = 'ALL';
        allOpt.textContent = 'All United States';
        stateSelect.appendChild(allOpt);
        states.forEach(function(s){
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          stateSelect.appendChild(opt);
        });
        console.log('[events] options count:', stateSelect.options.length, 'values:', Array.from(stateSelect.options).map(o => o.value));
      } catch (e) {
        console.error('[events] renderOptions error:', e);
      }
    }

    function renderEvents(data){
      const filtered = currentState === 'ALL' ? data : data.filter(function(ev){ return ev.state === currentState; });
      if (!filtered.length){
        status.textContent = 'No events available.';
        list.innerHTML = '';
        return;
      }
      status.textContent = 'Events are loaded from an external provider.';
      list.innerHTML = filtered.map(function(ev){
        return '<div class="event-card">' +
          '<div class="date">' + ev.date + '</div>' +
          (ev.state ? '<div class="badge" style="margin-bottom:10px;">' + ev.state + '</div>' : '') +
          '<h3>' + ev.title + '</h3>' +
          '<p>' + ev.desc + '</p>' +
          (ev.location ? '<p style="color:#9a9a9a;font-size:13px;margin-bottom:12px;">📍 ' + ev.location + '</p>' : '') +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
            '<a class="btn" href="event-detail.html?id=' + ev.id + '">Details</a>' +
            (ev.join_url ? '<a class="btn btn-secondary" target="_blank" rel="noopener" href="' + ev.join_url + '">Join</a>' : '') +
          '</div>' +
        '</div>';
      }).join('');
    }

    async function init(){
      try {
        const res = await fetch('events.json', {cache: 'no-store'});
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();
        console.log('[events] data length:', data.length);
        if (!Array.isArray(data)) throw new Error('bad data');
        const states = Array.from(new Set(data.map(function(ev){ return ev.state; }).filter(Boolean))).sort();
        console.log('[events] states:', states);
        renderOptions(states);
        renderEvents(data);
      } catch (e) {
        console.error('[events] error:', e);
        status.textContent = 'No events available.';
      }
    }

    if (stateSelect){
      stateSelect.addEventListener('change', function(){
        currentState = stateSelect.value;
        console.log('[events] filter changed:', currentState);
        init();
      });
    }

    init();
  })();
</script>
</body>
</html>
