<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecycleBin.com - Events</title>
<link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-header">
      <div class="container">
        <h1>Events</h1>
        <p>Community recycling, cleanup, and education.</p>
        <div class="filter-bar">
          <label for="stateSelect">Filter by state:</label>
          <select id="stateSelect"><option value="ALL">All United States</option></select>
        </div>
      </div>
    </section>
    <section>
      <div class="container">
        <div id="feed-status" class="feed-notice">Loading events…</div>
        <div id="event-list" class="event-list"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="./js/site.js"></script>
  <script>
  (function(){
    var listEl = document.getElementById('event-list');
    var statusEl = document.getElementById('feed-status');
    var stateSelect = document.getElementById('stateSelect');
    var current = 'ALL';
    function renderStates(states){
      if(!stateSelect) return;
      stateSelect.innerHTML = '';
      var items = Array.isArray(states) ? states.filter(Boolean).sort() : [];
      if(!items.length) items = ['CA','CO','FL','IL','NJ'];
      ['ALL'].concat(items).forEach(function(v){
        var opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v === 'ALL' ? 'All United States' : v;
        stateSelect.appendChild(opt);
      });
    }
    function card(ev){
      return '<div class="event-card"><div class="date">' + ev.date + '</div>' +
        (ev.state ? '<div class="badge">' + ev.state + '</div>' : '') +
        '<h3>' + ev.title + '</h3>' +
        (ev.desc ? '<p>' + ev.desc + '</p>' : '') +
        (ev.location ? '<p class="meta">' + ev.location + '</p>' : '') +
        '<a class="btn btn-primary" href="./event-detail.html?id=' + encodeURIComponent(ev.id) + '">Read More</a>' +
        (ev.join_url ? '<a class="btn btn-secondary" target="_blank" rel="noopener" href="' + ev.join_url + '">Join Now</a>' : '') +
      '</div>';
    }
    function render(data){
      var items = current === 'ALL' ? data.slice() : data.filter(function(x){ return x.state === current; });
      if(!items.length){ if(statusEl) statusEl.textContent = 'No events available.'; if(listEl) listEl.innerHTML = ''; return; }
      if(statusEl) statusEl.textContent = 'Events are loaded from an external provider.';
      if(listEl) listEl.innerHTML = items.map(card).join('');
    }
    async function load(){
      try{
        var res = await fetch('./events.json', {cache:'no-store'});
        if(!res.ok) throw new Error(res.status);
        var data = await res.json().catch(function(){ return []; });
      }catch(err){ render([]); renderStates([]); return; }
      var items = Array.isArray(data) ? data : [];
      renderStates(items.map(function(e){ return e.state; }));
      render(items);
    }
    if(stateSelect) stateSelect.addEventListener('change', function(){ current = stateSelect.value; render(window.__eventsData || []); });
    load();
  })();
  </script>
</body>
</html>
