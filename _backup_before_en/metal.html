<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecycleBin.com - Metal Guide</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #fff; background: #0b0b0b; }
  .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
  header { background: #0b0b0b; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
  .logo { font-size: 24px; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .logo span { background: #0f9d58; color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 20px; }
  .nav-right { display: flex; align-items: center; gap: 20px; }
  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links a { text-decoration: none; color: #c9c9c9; font-weight: 500; transition: color 0.2s; }
  .nav-links a:hover { color: #0f9d58; }
  .lang-toggle { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .page-header { padding: 80px 0 40px; }
  .page-header h1 { font-size: 42px; font-weight: 800; letter-spacing: -0.5px; }
  .page-header .desc { color: #9a9a9a; font-size: 18px; margin-top: 18px; }
  .detail-card { background: #111; border: 1px solid #1f1f1f; border-radius: 20px; padding: 28px; margin-top: 30px; }
  .detail-card h2 { font-size: 22px; margin-bottom: 14px; }
  .detail-card p { color: #9a9a9a; }
  .actions { margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
  .btn-secondary { background: #141414; color: #e8e8e8; border: 1px solid #2e2e2e; }
  footer { background: #050505; padding: 40px 0; border-top: 1px solid #141414; text-align: center; color: #555; font-size: 13px; margin-top: 80px; }
</style>
</head>
<body>
<header>
  <div class="container">
    <nav>
      <a href="index.html" class="logo"><span>Recycle</span> Bin.com</a>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="../guides.html" class="active">Guides</a></li>
          <li><a href="../centers.html">Centers</a></li>
        </ul>
        <button class="lang-toggle" onclick="toggleLanguage()">EN / 中文</button>
      </div>
    </nav>
  </div>
</header>
<main>
  <section class="page-header">
    <div class="container">
      <h1 data-i18n="title">金屬與鋁罐回收</h1>
      <p class="desc" data-i18n="desc">回收鋁節省 94% 能源。了解鐵罐、鋁罐、拆解注意事項。</p>
    </div>
  </section>
  <section>
    <div class="container">
      <div class="detail-card">
        <h2 data-i18n="detail_title">金屬回收重點</h2>
        <p data-i18n="detail_body">鋁罐與鐵罐可分開回收；壓扁可節省空間。請勿將含有食物殘餘的罐頭直接投入回收箱，應先沖洗乾淨。</p>
      </div>
      <div class="actions">
        <a href="../guides.html" class="btn btn-secondary" data-i18n="back">返回指南</a>
      </div>
    </div>
  </section>
</main>
<footer><div class="container"><p>&copy; 2025 RecycleBin.com</p></div></footer>
<script>
  const i18n = {
    'zh-Hant': { title:'金屬與鋁罐回收', desc:'回收鋁節省 94% 能源。了解鐵罐、鋁罐、拆解注意事項。', detail_title:'金屬回收重點', detail_body:'鋁罐與鐵罐可分開回收；壓扁可節省空間。請勿將含有食物殘餘的罐頭直接投入回收箱，應先沖洗乾淨。', back:'返回指南' },
    'en': { title:'Metal & Aluminum Cans', desc:'Recycling aluminum saves 94% energy. Learn about steel, aluminum, cans, and prep tips.', detail_title:'Metal Guide', detail_body:'Separate aluminum and steel cans when possible. Rinse food residue to avoid odors. Crush cans to save space.', back:'Back to Guides' }
  };
  function toggleLanguage(){ const c=document.documentElement.lang||'zh-Hant'; setLanguage(c==='zh-Hant'?'en':'zh-Hant'); }
  function setLanguage(l){ document.documentElement.lang=l; localStorage.setItem('recyclebin-lang',l); const m=i18n[l]||i18n['zh-Hant']; document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.getAttribute('data-i18n'); const v=m[k]; if(!v)return; el.innerHTML=v; }); }
  (function(){ const s=localStorage.getItem('recyclebin-lang'); if(s&&(s==='en'||s==='zh-Hant')) setLanguage(s); })();
</script>
</body>
</html>
