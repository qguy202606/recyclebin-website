<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="./css/main.css?h=1780497882">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="./favicon.svg">
<title>Search - RecycleBin.com</title>
<meta name="robots" content="noindex">
</head>
<body>
<div id="site-header"></div>


<main>
  <section class="page-header" style="padding: 100px 0 40px; text-align: center;">
    <div class="container">
      <h1>Search the site</h1>
      <p style="color:#9a9a9a; margin-top: 12px;">Guides, events, centers, and how-tos.</p>
      <div style="max-width: 640px; margin: 32px auto 0;">
        <input id="site-search" type="search" placeholder="Search guides, events, centers…" autocomplete="off" autofocus style="width: 100%; padding: 16px 20px; background: #141414; color: #f3f3f3; border: 1px solid #2e2e2e; border-radius: 14px; font-size: 18px; outline: none;">
        <div id="results" style="max-height: 60vh; overflow-y: auto; margin-top: 14px; background: #141414; border: 1px solid #2e2e2e; border-radius: 14px; display: none;"></div>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="./js/site.js"></script>
<script>
(function(){
  RecycleBin.initLayout({active: '/index.html'});
  RecycleBin.initI18n();
  RecycleBin.initSearch('site-search', 'results', './js/search-index.json');
})();
</script>
<script>
(function() {
  if (typeof RecycleBin !== 'undefined') {
    RecycleBin.loadHeader();
    RecycleBin.loadFooter();
  }
})();
</script>
</body>
</html>
