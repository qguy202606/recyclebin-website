<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="./css/main.css?h=1780497882">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="./favicon.svg">
<title>RecycleBin.com - Recycling Challenge Game</title>
</head>
<body>
<div id="site-header"></div>


<main>
  <section class="page-header">
    <div class="container">
      <h1>Recycling Challenge</h1>
      <p>Can you sort these items correctly? Beat your score and become a recycling pro.</p>
    </div>
  </section>
  <section>
    <div class="container">
      <div class="game-panel">
        <div class="stats">
          <div class="stat-pill">Score: <span id="score">0</span></div>
          <div class="stat-pill">Question: <span id="qidx">1</span> / <span id="qtotal">0</span></div>
        </div>
        <div class="progress-track"><div id="prog" class="progress-bar"></div></div>

        <div id="play-area">
          <h2 id="qtext" style="margin-top:22px;">Loading question…</h2>
          <div id="options" class="options"></div>
          <p id="hint" class="hint"></p>
        </div>

        <div id="end-area" class="end-card" style="display:none;">
          <h2>Game complete</h2>
          <div id="final-score" class="score">0</div>
          <p id="final-msg" class="msg"></p>
          <button id="replay" class="replay-btn" style="max-width:260px;margin:18px auto 0;text-align:center;">Play again</button>
        </div>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="./js/site.js"></script>
<script>
(function(){
  window.__rbErrors = window.__rbErrors || [];
  window._rbOldErr = window._rbOldErr || window.onerror;
  window.onerror = function(msg,url,line){
    window.__rbErrors.push(msg+' @ '+url+':'+line);
    if(window._rbOldErr) return window._rbOldErr(msg,url,line);
    return false;
  };
  try{
    if(!window.RecycleBin){
      var err = new Error('RecycleBin missing before page script');
      err.file = 'page';
      window.__rbErrors.push(err.message);
      throw err;
    }
  }catch(e){
    window.__rbErrors.push(e.message);
    console.error('[RecycleBin] startup fail', e);
  }
})();
(function(){
  RecycleBin.initLayout({active: '/howto.html'});
  RecycleBin.initI18n();

  var QUESTIONS = [
    {q:'Where does a rinsed plastic water bottle go?', options:['Trash','Recycling','Compost','E-waste'], answer:1, explain:'PET bottles are widely accepted in curbside recycling.'},
    {q:'A greasy pizza box belongs in:', options:['Recycling','Compost','Trash','Donate'], answer:2, explain:'Soiled paper contaminates recycling. Tear off the clean top to recycle.'},
    {q:'Used AA batteries should be taken to:', options:['Curbside bin','HHW facility / battery drop-off','Garden','Recycling'], answer:1, explain:'Batteries are hazardous at scale and need special handling.'},
    {q:'A clean glass wine bottle goes to:', options:['Trash','Recycling','Compost','Donate'], answer:1, explain:'Glass is infinitely recyclable when clean and sorted.'},
    {q:'Coffee grounds are best:', options:['Recycled','Composted','Trashed','Burned'], answer:1, explain:'Organics belong in compost, not recycling.'},
    {q:'Old smartphones belong in:', options:['Trash','Recycling bin','E-waste drop-off','Compost'], answer:2, explain:'E-waste drop-off ensures safe material recovery and data-safe handling.'},
    {q:'A flattened cardboard box should be:', options:['Trashed','Recycled if clean and dry','Composted','Burned'], answer:1, explain:'Clean, dry cardboard is high-value recycling.'},
    {q:'Plastic grocery bags go to:', options:['Curbside recycling','Grocery store drop-off','Trash always','Compost'], answer:1, explain:'Thin films jam sorting machines; return them to store bins.'},
    {q:'Leftover food should go to:', options:['Recycling','Compost or trash','Donate if safe','Any bin'], answer:1, explain:'Food scraps belong in compost where available.'},
    {q:'Which bin accepts clean aluminum cans?', options:['Trash','Recycling','Compost','Hazardous'], answer:1, explain:'Aluminum cans are high-value, endlessly recyclable metal.'}
  ];

  var scoreEl = document.getElementById('score');
  var qidxEl = document.getElementById('qidx');
  var qtotalEl = document.getElementById('qtotal');
  var progEl = document.getElementById('prog');
  var qtext = document.getElementById('qtext');
  var optionsEl = document.getElementById('options');
  var hint = document.getElementById('hint');
  var playArea = document.getElementById('play-area');
  var endArea = document.getElementById('end-area');
  var finalScore = document.getElementById('final-score');
  var finalMsg = document.getElementById('final-msg');

  var order = [];
  var idx = 0;
  var score = 0;

  function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

  function start(){
    order = shuffle(QUESTIONS);
    idx = 0;
    score = 0;
    scoreEl.textContent = '0';
    qtotalEl.textContent = order.length;
    endArea.style.display = 'none';
    playArea.style.display = 'block';
    next();
  }

  function next(){
    if(idx >= order.length){ finish(); return; }
    var q = order[idx];
    qidxEl.textContent = idx + 1;
    progEl.style.width = ((idx) / order.length * 100) + '%';
    qtext.textContent = q.q;
    optionsEl.innerHTML = '';
    hint.textContent = '';

    var buttons = q.options.map(function(text, i){
      var btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = text;
      btn.onclick = function(){ choose(i, btn); };
      return btn;
    });
    buttons.forEach(function(b){ optionsEl.appendChild(b); });
  }

  function choose(selected, btn){
    var q = order[idx];
    var all = optionsEl.querySelectorAll('.option-btn');
    for(var i=0;i<all.length;i++) all[i].disabled = true;

    if(selected === q.answer){
      btn.classList.add('correct');
      score += 10;
      scoreEl.textContent = score;
      hint.style.color = '#6dd49a';
    } else {
      btn.classList.add('wrong');
      all[q.answer].classList.add('correct');
      hint.style.color = '#d49a6d';
    }
    hint.textContent = q.explain;
    idx++;
    setTimeout(next, 900);
  }

  function finish(){
    playArea.style.display = 'none';
    endArea.style.display = 'block';
    finalScore.textContent = score + ' / ' + (order.length * 10);
    if(score >= order.length * 8){
      finalMsg.textContent = 'Impressive. You’re basically a recycling master.';
    } else if(score >= order.length * 5){
      finalMsg.textContent = 'Solid effort — you know the basics well.';
    } else {
      finalMsg.textContent = 'Nice try. Try again and learn from the explanations.';
    }
    progEl.style.width = '100%';
  }

  document.getElementById('replay').addEventListener('click', start);
  start();
})();
</script>
<script>
(function() {
  if (typeof RecycleBin !== 'undefined') {
    RecycleBin.loadHeader();
    RecycleBin.loadFooter();
  }
})();
</script>
</body>
</html>
