<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecycleBin.com - Event Detail</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #fff; background: #0b0b0b; }
  .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
  header { background: #0b0b0b; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
  .logo { font-size: 24px; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .logo span { background: #0f9d58; color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 20px; }
  .nav-right { display: flex; align-items: center; gap: 20px; }
  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links a { text-decoration: none; color: #c9c9c9; font-weight: 500; transition: color 0.2s; }
  .nav-links a:hover { color: #0f9d58; }
  .page-header { padding: 80px 0 40px; }
  .date-badge { display: inline-block; padding: 8px 14px; background: #11211a; color: #0f9d58; border: 1px solid #1e352a; border-radius: 10px; font-weight: 700; margin-bottom: 18px; }
  .page-header h1 { font-size: 42px; font-weight: 800; letter-spacing: -0.5px; }
  .page-header .desc { color: #9a9a9a; font-size: 18px; margin-top: 18px; }
  .meta-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; color: #bfbfbf; font-size: 14px; }
  .meta-row span { display: inline-flex; align-items: center; gap: 6px; }
  .detail-card { background: #111; border: 1px solid #1f1f1f; border-radius: 20px; padding: 28px; margin-top: 30px; }
  .detail-card h2 { font-size: 22px; margin-bottom: 14px; }
  .detail-card p { color: #9a9a9a; }
  .actions { margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary { background: #0f9d58; color: #fff; }
  .btn-primary:hover { background: #0b8043; }
  .btn-secondary { background: #141414; color: #e8e8e8; border: 1px solid #2e2e2e; }
  footer { background: #050505; padding: 40px 0; border-top: 1px solid #141414; text-align: center; color: #555; font-size: 13px; margin-top: 80px; }
  .error-msg { background: #1a0f0f; border: 1px solid #3a1f1f; color: #ff8a80; padding: 14px; border-radius: 10px; font-size: 14px; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <div class="container">
    <nav>
      <a href="index.html" class="logo"><span>Recycle</span> Bin.com</a>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="../centers.html">Centers</a></li>
          <li><a href="../events.html" class="active">Events</a></li>
        </ul>
      </div>
    </nav>
  </div>
</header>
<main>
  <section class="page-header">
    <div class="container">
      <div class="date-badge" id="event-date"></div>
      <h1 id="event-title"></h1>
      <div class="meta-row" id="event-meta"></div>
      <p class="desc" id="event-desc"></p>
    </div>
  </section>
  <section>
    <div class="container">
      <div id="error-box" class="error-msg hidden"></div>
      <div class="detail-card">
        <h2>Event Details</h2>
        <p id="event-body"></p>
      </div>
      <div class="actions">
        <a id="btn-external" class="btn btn-primary" href="#" target="_blank" rel="noopener">Join Now</a>
        <a href="../events.html" class="btn btn-secondary">Back to Events</a>
      </div>
    </div>
  </section>
</main>
<footer>
  <div class="container">
    <p>&copy; 2025 RecycleBin.com. All rights reserved.</p>
  </div>
</footer>
<script>
  async function loadEvent(){
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) { showError('Missing event id.'); return; }
    try {
      const res = await fetch('events.json', {cache: 'no-store'});
      if (!res.ok) throw new Error('fetch failed');
      const data = await res.json();
      const ev = (data || []).find(item => item.id === id);
      if (!ev) { showError('Event not found.'); return; }
      const dateEl = document.getElementById('event-date');
      const titleEl = document.getElementById('event-title');
      const descEl = document.getElementById('event-desc');
      const bodyEl = document.getElementById('event-body');
      const metaEl = document.getElementById('event-meta');
      const btnExt = document.getElementById('btn-external');
      if (dateEl) dateEl.textContent = ev.date || '';
      if (titleEl) titleEl.textContent = ev.title || '';
      if (descEl) descEl.textContent = ev.desc || '';
      if (bodyEl) bodyEl.textContent = ev.body || ev.desc || '';
      const metaItems = [];
      if (ev.location) metaItems.push(`<span>📍 ${ev.location}</span>`);
      if (ev.date) metaItems.push(`<span>🗓 ${ev.date}</span>`);
      const btnExt = document.getElementById('btn-external');
      if (btnExt) { btnExt.href = '#'; btnExt.textContent = 'Details only'; btnExt.classList.remove('btn-primary'); btnExt.classList.add('btn-secondary'); }
    } catch (e) {
      showError('Unable to load event details.');
    }
  }
  function showError(msg){
    const box = document.getElementById('error-box');
    if (box) { box.textContent = msg; box.classList.remove('hidden'); }
  }
  loadEvent();
</script>
</body>
</html>
