<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg">
<title>RecycleBin.com - Event</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #fff; background: #0b0b0b; }
  .container { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  header { background: #0b0b0b; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
  .logo { font-size: 24px; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .logo span { background: #0f9d58; color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 20px; }
  .nav-right { display: flex; align-items: center; gap: 20px; }
  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links a { text-decoration: none; color: #c9c9c9; font-weight: 500; transition: color 0.2s; }
  .nav-links a:hover { color: #0f9d58; }
  .lang-toggle { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .page-header { padding: 80px 0 40px; }
  .date-badge { display: inline-block; padding: 8px 14px; background: #11211a; color: #0f9d58; border: 1px solid #1e352a; border-radius: 10px; font-weight: 700; margin-bottom: 18px; }
  .page-header h1 { font-size: clamp(34px, 4vw, 46px); font-weight: 800; letter-spacing: -0.5px; }
  .page-header .desc { color: #9a9a9a; font-size: 18px; margin-top: 18px; }
  .detail-card { background: #111; border: 1px solid #1f1f1f; border-radius: 20px; padding: 28px; margin-top: 30px; }
  .detail-card h2 { font-size: 20px; margin-bottom: 14px; }
  .detail-card p { color: #b0b0b0; }
  .detail-card address { font-style: normal; color: #a0a0a0; }
  .actions { margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 14px; display: inline-block; }
  .btn-primary { background: #0f9d58; color: #fff; }
  .btn-secondary { background: #141414; color: #e8e8e8; border: 1px solid #2e2e2e; }
  .empty { background: #111; border: 1px solid #2e2e2e; color: #c0c0c0; padding: 14px 16px; border-radius: 12px; }
  footer { background: #050505; padding: 40px 0; border-top: 1px solid #141414; text-align: center; color: #555; font-size: 13px; margin-top: 80px; }
</style>
</head>
<body>
<header>
  <div class="container">
    <nav>
      <a href="index.html" class="logo"><span>Recycle</span> Bin.com</a>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="index.html" data-i18n="nav_home">Home</a></li>
          <li><a href="guides.html" data-i18n="nav_guides">Guides</a></li>
          <li><a href="centers.html" data-i18n="nav_centers">Centers</a></li>
          <li><a href="events.html" data-i18n="nav_events">Events</a></li>
          <li><a href="howto.html" data-i18n="nav_howto">How-To</a></li>
        </ul>
        <button id="langToggle" class="lang-toggle" type="button">EN</button>
      </div>
    </nav>
  </div>
</header>
<main>
  <section class="page-header">
    <div class="container">
      <div id="ev-date" class="date-badge"></div>
      <h1 id="ev-title"></h1>
      <p id="ev-desc" class="desc"></p>
      <p class="desc" id="ev-state" style="color:#b0b0b0;font-size:14px;"></p>
    </div>
  </section>
  <section>
    <div class="container">
      <div id="ev-body" class="detail-card">
        <h2 data-i18n="detail_title">About this event</h2>
        <p id="ev-body-text"></p>
      </div>
      <div id="ev-location" class="detail-card" style="display:none;">
        <h2>Location</h2>
        <address id="ev-loc-text"></address>
      </div>
      <div class="actions">
        <a id="ev-join" class="btn btn-primary" target="_blank" rel="noopener">Join now</a>
        <a href="/events.html" class="btn btn-secondary" data-i18n="event_back">Back to Events</a>
      </div>
    </div>
  </section>
</main>
<footer>
  <div class="container" id="site-footer"></div>
</footer>
<script src="/js/site.js"></script>
<script>
  (function(){
    RecycleBin.initLayout({active:'/events.html'});
    RecycleBin.initI18n();

    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    var dateEl = document.getElementById('ev-date');
    var titleEl = document.getElementById('ev-title');
    var descEl = document.getElementById('ev-desc');
    var stateEl = document.getElementById('ev-state');
    var bodyTextEl = document.getElementById('ev-body-text');
    var locBox = document.getElementById('ev-location');
    var locTextEl = document.getElementById('ev-loc-text');
    var joinEl = document.getElementById('ev-join');

    function missing(){
      if(dateEl) dateEl.textContent = '';
      if(titleEl) titleEl.textContent = 'Event not found';
      if(bodyTextEl) bodyTextEl.innerHTML = '<div class="empty">This event does not exist or has been removed.</div>';
    }

    function render(ev){
      if(!ev){ missing(); return; }
      if(dateEl) dateEl.textContent = (ev.date || '');
      if(titleEl) titleEl.textContent = (ev.title || '');
      if(descEl) descEl.textContent = (ev.desc || '');
      if(stateEl && ev.state) stateEl.textContent = 'State: ' + ev.state;
      if(bodyTextEl) bodyTextEl.textContent = (ev.body || ev.desc || '');
      if(ev.location){
        locBox.style.display = 'block';
        locTextEl.textContent = ev.location;
      } else {
        locBox.style.display = 'none';
      }
      if(ev.join_url){
        joinEl.href = ev.join_url;
        joinEl.style.display = 'inline-block';
      } else {
        joinEl.style.display = 'none';
      }
      if(ev.join_title) joinEl.textContent = ev.join_title || 'Join now';
    }

    function load(){
      var map = window.__eventsMap || {};
      var ev = id ? map[id] : null;
      if(!ev){
        render(missing);
        return false;
      }
      render(ev);
      return true;
    }

    function waitEvents(){
      if(window.__eventsLoaded){ return load(); }
      var tries = 0;
      return new Promise(function(resolve){
        function tick(){
          tries++;
          if(window.__eventsLoaded){ resolve(load()); return; }
          if(tries > 80){ resolve(load()); return; }
          setTimeout(tick, 120);
        }
        tick();
      });
    }

    if(window.__eventsLoaded){ load(); } else { waitEvents(); }
  })();
</script>
</body>
</html>
