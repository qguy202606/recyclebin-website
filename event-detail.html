<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg">
  <title>RecycleBin.com - Event Detail</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #fff; background: #0b0b0b; min-height: 100vh; display: flex; flex-direction: column; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  header { background: #0b0b0b; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
  .logo { font-size: 24px; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .logo span { background: #0f9d58; color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 20px; }
  .nav-right { display: flex; align-items: center; gap: 20px; }
  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links a { text-decoration: none; color: #c9c9c9; font-weight: 500; transition: color 0.2s; }
  .nav-links a:hover, .nav-links a.active { color: #0f9d58; }
  .page-header { padding: 80px 0 40px; text-align: center; }
  .page-header h1 { font-size: 48px; font-weight: 800; margin-bottom: 16px; }
  .page-header .meta { color: #8f8f8f; font-size: 18px; }
  .detail { max-width: 900px; margin: 0 auto; background: #111; border: 1px solid #1f1f1f; border-radius: 20px; padding: 24px; }
  .detail .date, .detail .location { display: inline-block; padding: 6px 12px; background: #11211a; color: #0f9d58; border: 1px solid #1e352a; border-radius: 10px; font-size: 13px; font-weight: 700; margin: 6px 8px 6px 0; }
  .detail h2 { font-size: 24px; margin: 18px 0 10px; }
  .detail p { color: #c7c7c7; font-size: 15px; margin-bottom: 14px; }
  .detail .actions { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
  .detail .btn { min-width: 160px; text-align: center; justify-content: center; }
  footer { background: #050505; padding: 40px 0; border-top: 1px solid #141414; text-align: center; color: #555; font-size: 13px; margin-top: auto; }
  .btn { display: inline-block; padding: 10px 22px; background: #0f9d58; color: #fff; border-radius: 8px; text-decoration: none; font-size: 14px; border: none; cursor: pointer; min-width: 160px; text-align: center; }
  .btn-secondary { background: #141414; color: #e8e8e8; border: 1px solid #2e2e2e; }
  .empty { color: #8f8f8f; padding: 60px 0; text-align: center; }
  .lang-toggle { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
  .lang-toggle:hover { border-color: #0f9d58; color: #0f9d58; }
  @media (max-width: 768px) { .nav-links { display: none; } .page-header h1 { font-size: 32px; } }
</style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <a href="index.html" class="logo"><span>Recycle</span> Bin.com</a>
        <div class="nav-right">
          <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="guides.html">Guides</a></li>
            <li><a href="centers.html">Centers</a></li>
            <li><a href="events.html" class="active">Events</a></li>
            <li><a href="howto.html">How-To</a></li>
          </ul>
          <button class="lang-toggle" id="langToggle" onclick="toggleLanguage()">EN</button>
        </div>
      </nav>
    </div>
  </header>
  <main>
    <section class="page-header">
      <div class="container" id="event-header">
        <h1>Event Detail</h1>
        <p class="meta" id="event-meta">Loading...</p>
      </div>
    </section>
    <section>
      <div class="container" id="event-body">
        <div class="empty">Loading...</div>
      </div>
    </section>
  </main>
  <footer>
    <div class="container">&copy; 2025 RecycleBin.com. All rights reserved.</div>
  </footer>
  <script>
    const i18n = {
      'en': {
        nav_home:'Home', nav_guides:'Guides', nav_centers:'Centers', nav_events:'Events', nav_howto:'How-To',
        detail_title:'Event Details', detail_body:'This is an open community event. All are welcome. Supplies and a short safety briefing will be provided. Wear outdoor-friendly clothing and bring a water bottle.',
        join:'Join Now', back:'Back to Events'
      },
      'zh': {
        nav_home:'首頁', nav_guides:'指南', nav_centers:'回收中心', nav_events:'活動', nav_howto:'教學',
        detail_title:'活動詳情', detail_body:'這是開放的社群活動，歡迎所有人參加。現場將提供基礎裝備與安全說明，請著適合戶外的衣物並自備水壺。',
        join:'立即參加', back:'回到活動列表'
      }
    };
    function toggleLanguage(){
      const cur = document.documentElement.lang || 'en';
      const next = cur === 'en' ? 'zh' : 'en';
      setLanguage(next);
    }
    function setLanguage(l){
      document.documentElement.lang = l;
      localStorage.setItem('recyclebin-lang', l);
      const m = i18n[l] || i18n['en'];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (!k) return;
        const v = m[k];
        if (!v) return;
        el.innerHTML = v;
      });
      const btn = document.getElementById('langToggle');
      if (btn) btn.textContent = l === 'zh' ? '中文' : 'EN';
    }
    (function(){
      const saved = localStorage.getItem('recyclebin-lang');
      if (saved === 'zh' || saved === 'en') setLanguage(saved);
    })();

    async function getEvent(){
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const header = document.getElementById('event-header');
      const meta = document.getElementById('event-meta');
      const body = document.getElementById('event-body');
      if (!id){
        header.innerHTML = '<h1 data-i18n="detail_title">Event Detail</h1>';
        meta.textContent = 'No event selected.';
        body.innerHTML = '<div class="empty">No event selected.</div>';
        return;
      }
      try {
        const res = await fetch('events.json', {cache: 'no-store'});
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error('bad data');
        const ev = data.find(item => item.id === id);
        if (!ev){
          header.innerHTML = '<h1 data-i18n="detail_title">Event Detail</h1>';
          meta.textContent = 'Event not found.';
          body.innerHTML = '<div class="empty">Event not found.</div>';
          return;
        }
        const dateStr = ev.date || '';
        const locStr = ev.location || '';
        const metaParts = [locStr, dateStr].filter(Boolean);
        header.innerHTML = '<h1>' + ev.title + '</h1>';
        meta.textContent = metaParts.join(' · ');
        body.innerHTML = '<div class="detail">' +
          '<div class="date">' + dateStr + '</div>' +
          (locStr ? '<div class="location">' + locStr + '</div>' : '') +
          '<h2 data-i18n="detail_title">About this event</h2>' +
          '<p>' + (ev.desc || '') + '</p>' +
          '<p>' + (ev.body || '') + '</p>' +
          '<div class="actions">' +
            '<a class="btn btn-secondary" href="events.html" data-i18n="back">Back to Events</a>' +
            '<a id="btn-join" class="btn" target="_blank" rel="noopener" href="' + (ev.join_url || '#') + '" data-i18n="join">Join Now</a>' +
          '</div>' +
        '</div>';
      } catch (e){
        header.innerHTML = '<h1 data-i18n="detail_title">Event Detail</h1>';
        meta.textContent = 'Failed to load event.';
        body.innerHTML = '<div class="empty">Failed to load event.</div>';
      }
    }
    getEvent();
  </script>
</body>
</html>
