<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecycleBin.com - Under Construction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
      color: #1b5e20;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }
    .leaves {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .leaf {
      position: absolute;
      font-size: 2em;
      opacity: 0.4;
      animation: floatLeaf 15s linear infinite;
    }
    .leaf:nth-child(1) { left: 10%; animation-duration: 12s; }
    .leaf:nth-child(2) { left: 30%; animation-duration: 18s; animation-delay: 2s; }
    .leaf:nth-child(3) { left: 50%; animation-duration: 14s; animation-delay: 4s; }
    .leaf:nth-child(4) { left: 70%; animation-duration: 16s; animation-delay: 1s; }
    .leaf:nth-child(5) { left: 90%; animation-duration: 20s; animation-delay: 3s; }
    @keyframes floatLeaf {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      width: 100%;
      animation: fadeIn 0.6s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .card {
      background: white;
      border-radius: 24px;
      padding: 50px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .illustration {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      font-size: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bin-svg { width: 100%; height: 100%; display: none; }
    h1 {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    p.tagline {
      color: #555;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .site-footer {
      text-align: center;
      padding: 16px 20px;
      color: #666;
      border-top: 2px solid #e8f5e9;
      font-size: 0.85em;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      border-radius: 0 0 24px 24px;
    }
    .site-footer .footer-links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .site-footer .footer-link {
      color: #2e7d32;
      text-decoration: none;
      font-weight: 600;
    }
    .site-footer .footer-link:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      h1 { font-size: 22px; }
      p.tagline { font-size: 14px; }
      .card { padding: 32px 20px; }
    }
  </style>
</head>
<body>
  <div class="leaves">
    <div class="leaf">🍃</div>
    <div class="leaf">🌿</div>
    <div class="leaf">🍂</div>
    <div class="leaf">🌱</div>
    <div class="leaf">☘️</div>
  </div>
  <div class="container">
    <div class="card">
      <div class="illustration">♻️</div>
      <h1>Under Construction</h1>
      <p class="tagline">We're building something <strong>awesome</strong> for a cleaner planet. The site will be back online shortly!</p>
      <footer class="site-footer">
        <div class="footer-links">
          <a class="footer-link" href="./index.html">Home</a>
          <a class="footer-link" href="./games.html">Games</a>
          <a class="footer-link" href="./guides.html">Guides</a>
          <a class="footer-link" href="./centers.html">Centers</a>
          <a class="footer-link" href="./events.html">Events</a>
          <a class="footer-link" href="./howto.html">How-To</a>
          <a class="footer-link" href="./lookup.html">Lookup</a>
        </div>
        <div>Made with 💚 for Earth 🌍</div>
        <div>&copy; <span id="footerYear">2026</span> RecycleBin.com. All rights reserved.</div>
      </footer>
    </div>
  </div>
  <script>
    try { document.getElementById('footerYear').textContent = new Date().getFullYear(); } catch (e) {}
  </script>
</body>
</html>
