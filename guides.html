<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecycleBin.com - Guides</title>
<link rel="stylesheet" href="./css/_site.css">
<style>
  .container {
    max-width: 900px;
    margin: 20px auto;
    background: rgba(255, 255, 255, 0.95);
    min-height: calc(100vh - 120px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    border-radius: 10px;
    padding: 30px 20px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 30px;
  }
  .page-header h1 {
    color: #2e7d32;
    font-size: 2em;
    margin-bottom: 10px;
  }
  .page-header p {
    color: #666;
    font-size: 1.1em;
  }

  ul.nav-links {
    list-style: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    text-align: center;
  }
  ul.nav-links li {
    width: 100%;
    max-width: 300px;
  }
  ul.nav-links a {
    display: block;
    padding: 16px 24px;
    background: #f5f5f5;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    text-decoration: none;
    color: #333;
    font-size: 1.1em;
    font-weight: 600;
    transition: all 0.2s;
  }
  ul.nav-links a:hover {
    background: #e8f5e9;
    border-color: #2e7d32;
    color: #2e7d32;
    transform: translateY(-2px);
  }

  .content-card {
    background: #f9f9f9;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
    border: 2px solid #e0e0e0;
  }
  .content-card h3 {
    color: #2e7d32;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <div id="site-header"></div>

<!-- Compact Menu Bar -->
<div class="menu-bar">
  <a href="./index.html"><span class="logo">♻️</span><span>RecycleBin</span></a>
  <nav class="menu-nav">
    <a class="menu-link" href="./games.html" data-menu="games">🎮 Games</a>
    <a class="menu-link" href="./guides.html" data-menu="guides">📚 Guides</a>
    <a class="menu-link" href="./centers.html" data-menu="centers">📍 Centers</a>
    <a class="menu-link" href="./events.html" data-menu="events">📅 Events</a>
    <a class="menu-link" href="./howto.html" data-menu="howto">🛠️ How-To</a>
  </nav>
</div>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Guides</h1>
      </div>
    </section>
    <section>
      <div class="container">
        <p>Recycling guides coming soon.</p>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="./js/menu.js"></script>
  <script src="./js/_site.js"></script>
</body>
</html>
