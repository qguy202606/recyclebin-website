<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecycleBin.com - Guides</title>
  <link rel="stylesheet" href="./css/_site.css" />
  <link rel="stylesheet" href="./css/main.css" />
  <style>
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: transparent;
    }
    .section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 34px 24px;
    }
    .section-title {
      font-size: 22px;
      font-weight: 800;
      color: #143024;
      margin-bottom: 18px;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
    .nav-card {
      background: #ffffff;
      border: 1px solid #dceee2;
      border-radius: 16px;
      padding: 22px 18px;
      text-decoration: none;
      color: #14432a;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      transition: transform .15s ease, box-shadow .2s ease;
    }
    .nav-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.1);
    }
    .nav-card h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .nav-card p {
      color: #3f5f47;
      line-height: 1.5;
    }
    .page-header {
      background: linear-gradient(135deg, #2e7d32 0%, #66bb6a 100%);
      color: #e6fff0;
      padding: 44px 24px 36px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 90;
    }
    @media (max-width: 860px) {
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="page-header" id="top">
  <div class="container">
    <h1>📚 Guides</h1>
    <p>Sorting rules, specialty drop-offs, and smarter habits.</p>
  </div>
</div>
<div class="container">
  <section class="section">
    <h2 class="section-title">Browse</h2>
    <div class="card-grid">
      <a class="nav-card" href="./howto.html"><h3>General Sorting</h3><p>Paper, plastic, metal, and glass basics.</p></a>
      <a class="nav-card" href="./centers.html"><h3>Find a Center</h3><p>Search or filter nearby drop-off points.</p></a>
      <a class="nav-card" href="./events.html"><h3>Events</h3><p>Cleanups, talks, and workshops.</p></a>
      <a class="nav-card" href="./games.html"><h3>Practice</h3><p>Trash sorting game and quiz mode.</p></a>
    </div>
  </section>
  <div id="site-footer"></div>
</div>
<script src="./js/menu.js"></script>
<script src="./js/footer.js"></script>
</body>
</html>
