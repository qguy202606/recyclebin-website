<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecycleBin.com - Centers</title>
<link rel="stylesheet" href="./css/_site.css">
<style>
  .container {
    max-width: 900px;
    margin: 20px auto;
    background: rgba(255, 255, 255, 0.95);
    min-height: calc(100vh - 120px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    border-radius: 10px;
    padding: 30px 20px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 30px;
  }
  .page-header h1 {
    color: #2e7d32;
    font-size: 2em;
    margin-bottom: 10px;
  }
  .page-header p {
    color: #666;
    font-size: 1.1em;
  }
</style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Centers</h1>
      </div>
    </section>
    <section>
      <div class="container">
        <p>Find a recycling center near you.</p>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="./js/site.js"></script>
  <script src="./js/i18n.js"></script>
</body>
</html>
