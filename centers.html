<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecycleBin.com - Centers</title>
<link rel="stylesheet" href="./css/_site.css">
<style>
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.95);
    min-height: calc(100vh - 60px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    animation: fadeIn 0.6s;
    display: flex;
    flex-direction: column;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  header {
    background: linear-gradient(135deg, #2e7d32 0%, #66bb6a 100%);
    color: #e6fff0;
    padding: 64px 20px 56px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  h1 { font-size: 38px; font-weight: 800; letter-spacing: 0.2px; margin-bottom: 12px; position: relative; z-index: 1; }
  .subtitle { opacity: 0.95; font-size: 17px; line-height: 1.6; color: #c8e6c9; position: relative; z-index: 1; }

  .center-section {
    padding: 30px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .controls input {
    flex: 1 1 220px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #e6f0ea;
    background: #fff;
    color: #1b5e20;
    outline: none;
  }
  .controls input:focus { border-color: #2e7d32; }
  .controls button {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #2e7d32;
    background: #2e7d32;
    color: white;
    cursor: pointer;
    font-weight: 700;
  }
  .controls button:hover { background: #1b5e20; }
  .controls button.secondary {
    background: white;
    color: #2e7d32;
  }
  .controls button.secondary:hover { background: #e8f5e9; }
  .location-line {
    color: #2e7d32;
    font-size: 13px;
    margin-bottom: 8px;
    min-height: 18px;
  }

  .center-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  @media (max-width: 860px) {
    .center-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 540px) {
    .center-grid { grid-template-columns: 1fr; }
  }
  .center-card {
    background: #ffffff;
    border: 1px solid #e6f0ea;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 4px 14px rgba(46, 125, 50, 0.06);
  }
  .center-card h3 {
    font-size: 15px;
    color: #1b5e20;
    margin-bottom: 4px;
  }
  .center-card .meta {
    color: #555;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .center-card .meta span { margin-right: 10px; }
  .center-card .actions {
    margin-top: 10px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .pill {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
    background: #e8f5e9;
    color: #1b5e20;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid #c8e6c9;
  }
  .no-results {
    color: #555;
    font-size: 14px;
    padding: 10px 0;
  }
</style>
</head>
<body>
<!-- Compact Menu Bar (uses shared CSS in css/_site.css and auto highlight in js/menu.js) -->
<div class="menu-bar">
  <a href="./index.html"><span class="logo">♻️</span><span>RecycleBin</span></a>
  <nav class="menu-nav">
    <a class="menu-link" href="./games.html" data-menu="games">🎮 Games</a>
    <a class="menu-link" href="./guides.html" data-menu="guides">📚 Guides</a>
    <a class="menu-link" href="./centers.html" data-menu="centers">📍 Centers</a>
    <a class="menu-link" href="./events.html" data-menu="events">📅 Events</a>
    <a class="menu-link" href="./howto.html" data-menu="howto">🛠️ How-To</a>
  </nav>
</div>

<div class="container">
  <header>
    <h1>📍 Recycling Centers</h1>
    <div class="subtitle">Find a recycling center near you in Orange County.</div>
  </header>

  <section class="center-section">
    <p id="locationLine" class="location-line"></p>
    <div class="controls">
      <input id="searchInput" type="text" placeholder="Enter city">
      <button id="searchBtn">Search</button>
      <button id="showAllBtn" class="secondary">Show All</button>
    </div>
    <div id="results" class="center-grid"></div>
  </section>

  <div id="site-footer"></div>
</div>

<script src="./js/menu.js"></script>
<script>
(function() {
  var centers = [];
  var userLat = null;
  var userLng = null;

  function haversineKm(a, b) {
    var R = 6371;
    var toRad = function(d) { return d * Math.PI / 180; };
    var dLat = toRad(b.lat - a.lat);
    var dLng = toRad(b.lng - a.lng);
    var lat1 = toRad(a.lat);
    var lat2 = toRad(b.lat);
    var h = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng/2) * Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  }

  function directionsUrl(c) {
    return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(c.address);
  }

  function render(list) {
    var box = document.getElementById("results");
    if (!list.length) {
      box.innerHTML = '<p class="no-results">No centers found matching your search.</p>';
      return;
    }
    box.innerHTML = list.map(function(c) {
      var distance = '';
      if (userLat !== null && userLng !== null) {
        distance = '<span>Distance: ~' + (haversineKm({lat: userLat, lng: userLng}, {lat: c.lat, lng: c.lng}) * 0.621371).toFixed(1) + ' miles</span>';
      }
      return '<div class="center-card">' +
        '<h3>' + c.name + '</h3>' +
        '<div class="meta">' +
          '<span>' + c.address + '</span>' +
          (distance ? distance : '') +
          '<span>Hours ' + c.hours + '</span>' +
        '</div>' +
        '<div class="actions">' +
          '<a href="' + directionsUrl(c) + '" target="_blank" rel="noopener">Get Directions</a>' +
          '<span style="color:#c8e6c9;font-size:12px;">|</span>' +
          (c.phone ? '<span style="color:#555;font-size:13px;">' + c.phone + '</span>' : '') +
          '<span style="flex:1"></span>' +
          c.materials.map(function(m) { return '<span class="pill">' + m + '</span>'; }).join(' ') +
        '</div>' +
      '</div>';
    }).join("");
  }

  function filtered(keyword) {
    if (!keyword) return centers.slice();
    var q = keyword.toLowerCase();
    return centers.filter(function(c) {
      return [c.name, c.address].join(" ").toLowerCase().indexOf(q) !== -1;
    });
  }

  function sortByDistance(list) {
    if (userLat === null || userLng === null) return list || centers.slice();
    return (list || centers.slice()).sort(function(a, b) {
      return haversineKm({lat: userLat, lng: userLng}, a) - haversineKm({lat: userLat, lng: userLng}, b);
    });
  }

  function activate() {
    var q = document.getElementById("searchInput").value.trim();
    var list = filtered(q);
    list = sortByDistance(list);
    render(list);
  }

  fetch("./centers/centers.json", {cache: "no-store"}).then(function(r) {
    return r.ok ? r.json() : [];
  }).then(function(data) {
    centers = data || [];
    activate();
  }).catch(function() {
    document.getElementById("results").innerHTML = '<p class="no-results">Center data is currently unavailable.</p>';
  });

  document.getElementById("searchBtn").addEventListener("click", activate);
  document.getElementById("searchInput").addEventListener("keydown", function(e) { if (e.key === "Enter") activate(); });
  document.getElementById("showAllBtn").addEventListener("click", function() {
    document.getElementById("searchInput").value = "";
    activate();
  });

  var DEFAULT_LAT = 33.6846;
  var DEFAULT_LNG = -117.8265;

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      document.getElementById("locationLine").textContent = "Detected area (" + userLat.toFixed(2) + ", " + userLng.toFixed(2) + ") — approximate location";
      activate();
    }, function() {
      userLat = DEFAULT_LAT;
      userLng = DEFAULT_LNG;
      document.getElementById("locationLine").textContent = "Showing results sorted by approximate distance from Irvine, CA";
      activate();
    });
  } else {
    userLat = DEFAULT_LAT;
    userLng = DEFAULT_LNG;
    document.getElementById("locationLine").textContent = "Showing results sorted by approximate distance from Irvine, CA";
    activate();
  }
})();
</script>

</body>
</html>
