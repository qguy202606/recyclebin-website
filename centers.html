<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecycleBin.com - Centers</title>
<link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-header">
      <div class="container">
        <h1>Recycling Centers</h1>
        <p>Find nearby drop-off locations.</p>
      </div>
    </section>
    <section>
      <div class="container">
        <div id="center-list" class="center-grid">
          <p class="empty">Loading centers…</p>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="./js/site.js"></script>
  <script>
  (function(){
    var listEl = document.getElementById('center-list');
    fetch('./centers.json', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){
        var items = Array.isArray(data) ? data : [];
        if (!items.length) { listEl.innerHTML = '<p class="empty">No centers found.</p>'; return; }
        listEl.innerHTML = items.map(function(c){
          return '<div class="center-card">' +
            '<h3>' + (c.name || 'Center') + '</h3>' +
            '<p class="addr">' + (c.address || '') + '</p>' +
            '<p class="meta">' + (c.hours || '') + '</p>' +
            '<a class="btn btn-primary" href="' + (c.map_url || '#') + '" target="_blank" rel="noopener">Map</a>' +
          '</div>';
        }).join('');
      })
      .catch(function(){ listEl.innerHTML = '<p class="empty">Could not load centers.</p>'; });
  })();
  </script>
</body>
</html>
