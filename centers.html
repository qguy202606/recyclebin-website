<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecycleBin.com - Centers</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  a { color: #66bb6a; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Header */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid #1f1f1f;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 1.1em;
    color: #fff;
    text-decoration: none;
  }
  .brand .logo {
    background: #2e7d32;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .nav-links {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .nav-links a {
    padding: 6px 10px;
    border-radius: 999px;
    background: #141414;
    color: #ddd;
    font-size: 0.85em;
    font-weight: 600;
    text-decoration: none;
  }
  .nav-links a:hover { background: #1f1f1f; }
  .nav-links a.active {
    background: #2e7d32;
    color: #fff;
  }

  /* Page */
  .page {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 20px 40px;
  }
  .page-header { margin-bottom: 24px; }
  .page-header h1 { font-size: 28px; margin-bottom: 8px; }
  .page-header p { color: #bbb; font-size: 15px; }

  /* Controls */
  .location-line {
    color: #bbb;
    font-size: 13px;
    margin-bottom: 10px;
    min-height: 18px;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin: 10px 0 18px;
    flex-wrap: wrap;
  }
  .controls input {
    flex: 1 1 220px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #2f2f2f;
    background: #141414;
    color: #fff;
    outline: none;
  }
  .controls input:focus { border-color: #2e7d32; }
  .controls button {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #2f2f2f;
    background: #141414;
    color: #ddd;
    cursor: pointer;
    font-weight: 600;
  }
  .controls button:hover { background: #1f1f1f; }
  .controls button.primary {
    background: #2e7d32;
    border-color: #2e7d32;
    color: #fff;
  }
  .controls button.primary:hover { background: #1b5e20; }

  /* Center cards */
  .center-list {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  @media (max-width: 860px) {
    .center-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 540px) {
    .center-list { grid-template-columns: 1fr; }
  }
  .center-card {
    background: #0a0a0a;
    border: 1px solid #1f1f1f;
    border-radius: 12px;
    padding: 16px;
  }
  .center-card h3 {
    font-size: 16px;
    margin-bottom: 4px;
  }
  .center-card .meta {
    color: #bbb;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .center-card .meta span { margin-right: 14px; }
  .center-card .actions {
    margin-top: 8px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .pill {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 999px;
    background: #142214;
    color: #81c784;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid #1f3a1f;
  }
  .no-results {
    color: #bbb;
    font-size: 14px;
    padding: 10px 0;
  }
</style>
</head>
<body>

<div class="site-header">
  <a class="brand" href="./index.html">
    <span class="logo">Recycle</span>
    <span>Bin.com</span>
  </a>
  <nav class="nav-links">
    <a href="./games.html">Home</a>
    <a href="./guides.html">Guides</a>
    <a href="./centers.html" class="active">Centers</a>
    <a href="./events.html">Events</a>
    <a href="./howto.html">How-To Tutorials</a>
  </nav>
</div>

<div class="page">
  <div class="page-header">
    <h1>Find a Recycling Center</h1>
    <p>Find the nearest recycling drop-off locations.</p>
  </div>
  <div id="locationLine" class="location-line"></div>
  <div class="controls">
    <input id="searchInput" type="text" placeholder="Enter city">
    <button id="searchBtn" class="primary">Search</button>
    <button id="showAllBtn">Show All</button>
  </div>
  <div id="results" class="center-list"></div>
</div>

<script>
(function() {
  var centers = [];
  var userLat = null;
  var userLng = null;

  function haversineKm(a, b) {
    var R = 6371;
    var toRad = function(d) { return d * Math.PI / 180; };
    var dLat = toRad(b.lat - a.lat);
    var dLng = toRad(b.lng - a.lng);
    var lat1 = toRad(a.lat);
    var lat2 = toRad(b.lat);
    var h = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng/2) * Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  }

  function directionsUrl(c) {
    return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(c.address);
  }

  function render(list) {
    var box = document.getElementById("results");
    if (!list.length) {
      box.innerHTML = '<p class="no-results">No centers found matching your search.</p>';
      return;
    }
    box.innerHTML = list.map(function(c) {
      var distance = '';
      if (userLat !== null && userLng !== null) {
        distance = '<span>Distance: ~' + haversineKm({lat: userLat, lng: userLng}, {lat: c.lat, lng: c.lng}).toFixed(1) + ' km</span>';
      }
      return '<div class="center-card">' +
        '<h3>' + c.name + '</h3>' +
        '<div class="meta">' +
          '<span>' + c.address + '</span>' +
          (distance ? distance : '') +
          '<span>Hours ' + c.hours + '</span>' +
        '</div>' +
        '<div class="actions">' +
          '<a href="' + directionsUrl(c) + '" target="_blank" rel="noopener">Get Directions</a>' +
          '<span style="color:#444;font-size:12px;">|</span>' +
          (c.phone ? '<span style="color:#bbb;font-size:13px;">' + c.phone + '</span>' : '') +
          '<span style="flex:1"></span>' +
          c.materials.map(function(m) { return '<span class="pill">' + m + '</span>'; }).join(' ') +
        '</div>' +
      '</div>';
    }).join("");
  }

  function filtered(keyword) {
    if (!keyword) return centers.slice();
    var q = keyword.toLowerCase();
    return centers.filter(function(c) {
      return [c.name, c.address].join(" ").toLowerCase().indexOf(q) !== -1;
    });
  }

  function sortByDistance() {
    if (userLat === null || userLng === null) return centers.slice();
    return centers.slice().sort(function(a, b) {
      return haversineKm({lat: userLat, lng: userLng}, a) - haversineKm({lat: userLat, lng: userLng}, b);
    });
  }

  function blurByProximity() {
    if (userLat !== null && userLng !== null) {
      centers.forEach(function(c) {
        c.distanceKm = haversineKm({lat: userLat, lng: userLng}, c);
      });
    }
  }

  function activate() {
    var q = document.getElementById("searchInput").value.trim();
    var list = filtered(q);
    list = sortByDistance();
    render(list);
  }

  fetch("./centers/centers.json", {cache: "no-store"}).then(function(r) {
    return r.ok ? r.json() : [];
  }).then(function(data) {
    centers = data || [];
    activate();
  }).catch(function() {
    document.getElementById("results").innerHTML = '<p class="no-results">Center data is currently unavailable.</p>';
  });

  document.getElementById("searchBtn").addEventListener("click", activate);
  document.getElementById("searchInput").addEventListener("keydown", function(e) { if (e.key === "Enter") activate(); });
  document.getElementById("showAllBtn").addEventListener("click", function() {
    document.getElementById("searchInput").value = "";
    activate();
  });

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      document.getElementById("locationLine").textContent = "Detected area (" + userLat.toFixed(2) + ", " + userLng.toFixed(2) + ") — approximate location";
      activate();
    }, function() {
      document.getElementById("locationLine").textContent = "";
    });
  }
})();
</script>

</body>
</html>
